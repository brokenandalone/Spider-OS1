name: Build Native Spider OS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-spider-os:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout Spider OS
        uses: actions/checkout@v5

      - name: Free build disk space
        run: |
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf "${AGENT_TOOLSDIRECTORY}" || true
          docker system prune -af || true
          sudo apt-get clean
          df -h

      - name: Validate Spider OS scripts
        run: |
          bash -n distro/build-iso.sh
          test -f distro/packages/spider-os-packages.list
          test -f distro/systemd/spider-os.service
          test -f webbie/service/webbie.service
          test -x spider-core/bin/spider-core
          test -x webbie/webbie
          test -x webbie/agent/webbie.py

      - name: Install ISO build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            rsync \
            squashfs-tools \
            xorriso \
            qemu-system-x86 \
            ovmf

      - name: Build Spider OS
        run: |
          sudo -E ./distro/build-iso.sh

      - name: Inspect completed ISO
        run: |
          ls -lh build/
          cat build/Spider_OS_24.04.5_amd64.iso.sha256
          xorriso \
            -indev build/Spider_OS_24.04.5_amd64.iso \
            -report_el_torito plain

      - name: Split ISO for release
        run: |
          cd build

          split \
            -b 1900M \
            -d \
            -a 3 \
            Spider_OS_24.04.5_amd64.iso \
            Spider_OS_24.04.5_amd64.iso.part-

          cat > REASSEMBLE.txt <<'TXT'
          SPIDER OS ISO REASSEMBLY

          Linux/macOS:
          cat Spider_OS_24.04.5_amd64.iso.part-* \
            > Spider_OS_24.04.5_amd64.iso

          Windows PowerShell:

          $parts = Get-ChildItem "Spider_OS_24.04.5_amd64.iso.part-*" |
              Sort-Object Name

          $output = [System.IO.File]::Create(
              "Spider_OS_24.04.5_amd64.iso"
          )

          foreach ($part in $parts) {
              $input = [System.IO.File]::OpenRead($part.FullName)
              $input.CopyTo($output)
              $input.Dispose()
          }

          $output.Dispose()

          Then verify Spider_OS_24.04.5_amd64.iso against:
          Spider_OS_24.04.5_amd64.iso.sha256
          TXT

          ls -lh Spider_OS_24.04.5_amd64.iso.part-*

      - name: Publish Spider OS build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="spider-os-build-${GITHUB_RUN_NUMBER}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release already exists; updating assets."
          else
            gh release create "${TAG}" \
              --title "Spider OS Native Build ${GITHUB_RUN_NUMBER}" \
              --notes "Native Spider OS development build based on Ubuntu Studio 24.04.5." \
              --prerelease
          fi

          gh release upload "${TAG}" \
            build/Spider_OS_24.04.5_amd64.iso.part-* \
            build/Spider_OS_24.04.5_amd64.iso.sha256 \
            build/REASSEMBLE.txt \
            --clobber
